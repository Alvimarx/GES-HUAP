document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-size:11px;font-weight:700;background:#FCE3EA;color:#8A1E44;padding:4px 10px;border-radius:999px\">Borrador — pendiente validación Unidad GES<\u002Fdiv>\n  <\u002Fdiv>\n  <h1 style=\"margin:14px 0 6px;font-size:26px;line-height:1.15;font-weight:900;letter-spacing:-.01em\">¿Qué hago con mi paciente GES?<\u002Fh1>\n  <p style=\"margin:0;font-size:13px;font-weight:600;opacity:.92\">Guía de procedimiento para clínicos del HUAP. No sustituye el juicio médico ni las Guías Clínicas MINSAL.<\u002Fp>\n  <div style=\"margin-top:10px;font-size:11.5px;font-weight:700;opacity:.85\">DS N°29/2025 · NTMA D.E. 57/2025 mod. 32/2026 · revisado 30-07-2026<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:center;gap:8px;padding:14px 20px 4px;font-size:12px;font-weight:800;color:#5A6B8C\">\n  <span style=\"background:#0C2B5E;color:#fff;border-radius:999px;padding:2px 10px\">Paso {{stepNum}} de 3<\u002Fspan>\n  <span>{{stepTitle}}<\u002Fspan>\n<\u002Fdiv>\n\n<sc-if value=\"{{viewProblema}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding:10px 16px 0\">\n  <div style=\"font-size:19px;font-weight:900;margin:6px 4px 10px\">¿Sospecha una de estas patologías?<\u002Fdiv>\n  <input placeholder=\"Buscar por nombre o código CIE-10…\" sc-camel-on-input=\"{{onQ}}\" style=\"width:100%;box-sizing:border-box;padding:14px 18px;border-radius:999px;border:2px solid #C6D6EC;background:#fff;font-size:15px;font-weight:600;color:#0C2B5E;outline-color:#0D5BD8\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px\">\n    <sc-for list=\"{{problemas}}\" as=\"p\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{p.pick}}\" style=\"display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;padding:12px 14px;cursor:pointer;font-family:inherit;min-height:56px\" style-hover=\"border-color:#0D5BD8;box-shadow:0 2px 10px rgba(13,91,216,.12)\">\n        <span style=\"flex:none;background:#C9F2E3;color:#0C2B5E;font-weight:900;font-size:13px;padding:6px 10px;border-radius:999px;letter-spacing:.02em\">{{p.cieTxt}}<\u002Fspan>\n        <span style=\"flex:1;font-size:14.5px;font-weight:700;color:#0C2B5E;line-height:1.25\">{{p.nombre}}<\u002Fspan>\n        <sc-if value=\"{{p.tiempo}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:none;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#B31D52;background:#FCE3EA;padding:3px 8px;border-radius:999px\">min / horas<\u002Fspan><\u002Fsc-if>\n        <span style=\"flex:none;color:#8FA6C6;font-weight:900\">›<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{sinResultados}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:10px;background:#fff;border:1.5px dashed #C6D6EC;border-radius:16px;padding:16px;font-size:14px;font-weight:600;color:#5A6B8C\">Sin coincidencias en los 14 problemas GES del HUAP.<\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"margin-top:16px;background:#0C2B5E;color:#fff;border-radius:18px;padding:16px 18px\">\n    <div style=\"font-size:15px;font-weight:900;margin-bottom:4px\">¿No está en la lista?<\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:600;line-height:1.5;opacity:.92\">HUAP confirma y trata estos 14 problemas GES. Ante cualquier duda, llame a la Unidad GES: anexos {{anexos}} · <a href=\"mailto:ges@huap.online\" style=\"color:#9FE8CC;font-weight:800\">ges@huap.online<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{viewEtapa}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:10px 16px 0\">\n  <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;padding:12px 14px\">\n    <span style=\"background:#C9F2E3;color:#0C2B5E;font-weight:900;font-size:12px;padding:5px 10px;border-radius:999px\">{{selCie}}<\u002Fspan>\n    <span style=\"flex:1;font-size:14px;font-weight:800\">{{selNombre}}<\u002Fspan>\n    <button sc-camel-on-click=\"{{volverProblema}}\" style=\"background:none;border:none;color:#0D5BD8;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px\">Cambiar<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"margin:16px 4px 8px;font-size:13px;font-weight:800;color:#5A6B8C\">¿Dónde atiende al paciente?<\u002Fdiv>\n  <div style=\"display:flex;gap:8px\">\n    <button sc-camel-on-click=\"{{setUrg}}\" style=\"{{ctxUrgStyle}}\">Urgencia<\u002Fbutton>\n    <button sc-camel-on-click=\"{{setPiso}}\" style=\"{{ctxPisoStyle}}\">Piso / hospitalizado<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"margin:18px 4px 8px;font-size:19px;font-weight:900\">¿En qué punto está el paciente?<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <sc-for list=\"{{etapas}}\" as=\"e\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{e.pick}}\" style=\"display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;padding:14px;cursor:pointer;font-family:inherit;min-height:60px\" style-hover=\"border-color:#0D5BD8;box-shadow:0 2px 10px rgba(13,91,216,.12)\">\n        <span style=\"flex:none;width:30px;height:30px;border-radius:999px;background:#EDF2F9;color:#0C2B5E;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center\">{{e.num}}<\u002Fspan>\n        <span style=\"flex:1\">\n          <span style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:#0C2B5E\">{{e.nombre}}\n            <sc-if value=\"{{e.badge}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;background:#D02E63;color:#fff;padding:3px 8px;border-radius:999px;animation:pulseA 2s infinite\">{{e.badge}}<\u002Fspan><\u002Fsc-if>\n          <\u002Fspan>\n          <span style=\"display:block;font-size:12.5px;font-weight:600;color:#5A6B8C;margin-top:2px\">{{e.desc}}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;color:#8FA6C6;font-weight:900\">›<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{viewAcciones}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:10px 16px 0\">\n  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n    <button sc-camel-on-click=\"{{volverEtapa}}\" style=\"background:#fff;border:1.5px solid #D9E5F3;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:#0D5BD8;cursor:pointer;font-family:inherit\">‹ {{selCorto}}<\u002Fbutton>\n    <span style=\"background:#C9F2E3;color:#0C2B5E;font-weight:900;font-size:12px;padding:6px 12px;border-radius:999px\">{{etapaNombre}}<\u002Fspan>\n    <span style=\"background:#EDF2F9;border:1.5px solid #D9E5F3;color:#5A6B8C;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px\">{{ctxNombre}}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin:16px 4px 8px;display:flex;align-items:baseline;justify-content:space-between\">\n    <div style=\"font-size:19px;font-weight:900\">Haga esto ahora<\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;color:#5A6B8C\">{{doneCount}} de {{totalCount}} listas<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <sc-for list=\"{{accs}}\" as=\"a\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{a.toggle}}\" style=\"{{a.rowStyle}}\">\n        <span style=\"{{a.boxStyle}}\">\n          <sc-if value=\"{{a.done}}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#0C2B5E\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"flex:1\">\n          <span style=\"display:block;font-size:14.5px;font-weight:800;line-height:1.3;color:#0C2B5E\">{{a.t}}<\u002Fspan>\n          <span style=\"display:block;font-size:12.5px;font-weight:600;color:#5A6B8C;line-height:1.45;margin-top:3px\">{{a.d}}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{hayPlazos}}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"margin:20px 4px 8px;font-size:16px;font-weight:900\">Plazos que corren<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <sc-for list=\"{{plazos}}\" as=\"z\" hint-placeholder-count=\"2\">\n      <div style=\"background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;padding:14px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"{{z.chipStyle}}\">{{z.big}}<\u002Fspan>\n          <span style=\"flex:1\">\n            <span style=\"display:block;font-size:14px;font-weight:800;line-height:1.3\">{{z.hito}}<\u002Fspan>\n            <span style=\"display:block;font-size:12px;font-weight:600;color:#5A6B8C;margin-top:2px\">desde {{z.desde}}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{z.nota}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:8px;font-size:12px;font-weight:600;color:#5A6B8C;background:#EDF2F9;border-radius:10px;padding:8px 10px\">{{z.nota}}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{z.corregido}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:8px;font-size:12px;font-weight:700;color:#8A1E44;background:#FCE3EA;border-radius:10px;padding:8px 10px\">Corrección al afiche: {{z.corregido}}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{z.calcType}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed #D9E5F3;padding-top:10px\">\n            <label style=\"font-size:12px;font-weight:700;color:#5A6B8C\">{{z.calcLabel}}<\u002Flabel>\n            <input type=\"{{z.calcType}}\" sc-camel-on-change=\"{{z.onCalc}}\" style=\"border:1.5px solid #C6D6EC;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:#0C2B5E\">\n            <sc-if value=\"{{z.calcOut}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;font-weight:900;color:#fff;background:#0C2B5E;padding:5px 12px;border-radius:999px\">límite: {{z.calcOut}}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin:8px 4px 0;font-size:11px;font-weight:600;color:#8FA6C6\">Cálculo referencial — no se guarda ningún dato del paciente.<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{postNota}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:10px;background:#EDF2F9;border:1.5px solid #D9E5F3;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;color:#5A6B8C\">{{postNota}}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:18px;background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;overflow:hidden\">\n    <button sc-camel-on-click=\"{{toggleCasos}}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:900;color:#0C2B5E\">Casos especiales — si… entonces… <span style=\"color:#0D5BD8\">{{casosCaret}}<\u002Fspan><\u002Fbutton>\n    <sc-if value=\"{{showCasos}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 16px 14px;display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{casos}}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"border-left:3px solid #C9F2E3;padding:2px 0 2px 12px\">\n            <div style=\"font-size:13px;font-weight:800\">{{c.si}}<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:600;color:#5A6B8C;line-height:1.45;margin-top:2px\">{{c.entonces}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:10px;background:#fff;border:1.5px solid #D9E5F3;border-radius:16px;overflow:hidden\">\n    <button sc-camel-on-click=\"{{toggleNtma}}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:900;color:#0C2B5E\">Criterios NTMA de este problema <span style=\"color:#0D5BD8\">{{ntmaCaret}}<\u002Fspan><\u002Fbutton>\n    <sc-if value=\"{{showNtma}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 16px 14px;display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ntma}}\" as=\"n\" hint-placeholder-count=\"2\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#3D5378;line-height:1.5;border-left:3px solid #D9E5F3;padding-left:12px\">{{n.txt}}<\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-size:11px;font-weight:700;color:#8A1E44;background:#FCE3EA;border-radius:10px;padding:8px 10px\">Transcripción de la NTMA pendiente de validación por la Unidad GES.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin:14px 4px 0;font-size:11px;font-weight:600;color:#8FA6C6\">Fuente: {{fuente}}<\u002Fdiv>\n\n  <div style=\"display:flex;gap:8px;margin-top:16px\">\n    <button sc-camel-on-click=\"{{volverEtapa}}\" style=\"flex:1;background:#fff;border:1.5px solid #C6D6EC;border-radius:999px;padding:14px;font-size:14px;font-weight:800;color:#0D5BD8;cursor:pointer;font-family:inherit\">‹ Momento<\u002Fbutton>\n    <sc-if value=\"{{haySiguiente}}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{siguiente}}\" style=\"flex:2;background:#0D5BD8;border:none;border-radius:999px;padding:14px;font-size:14px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit\" style-hover=\"background:#0A46A8\">{{siguienteLabel}} ›<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none\">\n  <div style=\"width:100%;max-width:600px;background:#0C2B5E;color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;pointer-events:auto\">\n    <a href=\"tel:225685221\" style=\"flex:none;background:#C9F2E3;color:#0C2B5E;text-decoration:none;font-weight:900;font-size:13px;padding:9px 16px;border-radius:999px\">Llamar<\u002Fa>\n    <a href=\"mailto:ges@huap.online\" style=\"flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px\">ges@huap.online<\u002Fa>\n    <span style=\"font-size:10.5px;font-weight:600;opacity:.75;line-height:1.3\">Anexos {{anexos}}<br>{{horario}}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'problema', q: '', ps: null, etapa: null, ctx: 'urgencia', checks: {}, calc: {}, showCasos: false, showNtma: false, D: null };\n  componentDidMount() {\n    import((window.__resources && window.__resources.gesData) || './ges-data.js').then(m => {\n      let c = {};\n      try { c = JSON.parse(localStorage.getItem('gesChecksA') || '{}'); } catch (e) {}\n      this.setState({ D: m, checks: c });\n    });\n  }\n  saveChecks(c) { this.setState({ checks: c }); try { localStorage.setItem('gesChecksA', JSON.stringify(c)); } catch (e) {} }\n  fmtPlazo(z) { return z.u === 'ya' ? 'Inmediata' : z.u === 'min' ? z.n + ' min' : z.u === 'h' ? z.n + ' h' : z.n + ' días'; }\n  calcOut(z, val) {\n    if (!val) return '';\n    if (z.u === 'min' || z.u === 'h') {\n      const p = val.split(':'); if (p.length < 2) return '';\n      let tot = (+p[0]) * 60 + (+p[1]) + z.n * (z.u === 'h' ? 60 : 1);\n      const dd = Math.floor(tot / 1440); tot %= 1440;\n      const pad = x => String(x).padStart(2, '0');\n      return pad(Math.floor(tot / 60)) + ':' + pad(tot % 60) + (dd ? ' (+' + dd + (dd > 1 ? ' días)' : ' día)') : '');\n    }\n    const d = new Date(val + 'T12:00:00'); if (isNaN(d)) return '';\n    d.setDate(d.getDate() + z.n);\n    const ds = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], ms = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n    return ds[d.getDay()] + ' ' + d.getDate() + ' ' + ms[d.getMonth()];\n  }\n  renderVals() {\n    const S = this.state, D = S.D;\n    const ETAPAS = D ? D.ETAPAS : [];\n    const sel = D && S.ps != null ? D.PROBLEMAS.find(p => p.ps === S.ps) : null;\n    const q = S.q.trim().toLowerCase();\n    const problemas = (D ? D.PROBLEMAS : []).filter(p =>\n      !q || p.nombre.toLowerCase().includes(q) || p.corto.toLowerCase().includes(q) || p.cie.some(c => c.toLowerCase().includes(q))\n    ).map(p => ({\n      key: p.ps, cieTxt: p.cie.join(' · '), nombre: p.nombre, tiempo: !!p.tiempo,\n      pick: () => this.setState({ ps: p.ps, view: 'etapa' })\n    }));\n    const etapas = ETAPAS.map((e, i) => ({\n      key: e.id, num: i + 1, nombre: e.nombre, desc: e.desc, badge: e.badge || false,\n      pick: () => this.setState({ etapa: e.id, view: 'acciones', showCasos: e.id === 'confirmacion', showNtma: false })\n    }));\n    const ctxBtn = on => 'flex:1;padding:11px;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:900;cursor:pointer;' +\n      (on ? 'background:#0C2B5E;color:#fff;border:1.5px solid #0C2B5E' : 'background:#fff;color:#5A6B8C;border:1.5px solid #C6D6EC');\n    let accs = [], plazos = [], ntma = [], postNota = '';\n    if (sel && S.etapa) {\n      const comunes = (D.ACCIONES_COMUNES[S.etapa] || []).filter(a => !a.ctx || a.ctx === S.ctx);\n      const extras = (sel.extras && sel.extras[S.etapa]) || [];\n      accs = [...extras, ...comunes].map((a, i) => {\n        const k = sel.ps + '.' + S.etapa + '.' + i + '.' + a.t.slice(0, 18);\n        const done = !!S.checks[k];\n        return {\n          key: k, t: a.t, d: a.d, done,\n          rowStyle: 'display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border-radius:16px;padding:13px 14px;cursor:pointer;font-family:inherit;' + (done ? 'background:#F2FBF7;border:1.5px solid #9FE8CC;opacity:.75' : 'background:#fff;border:1.5px solid #D9E5F3'),\n          boxStyle: 'flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-top:1px;' + (done ? 'background:#9FE8CC;border:2px solid #9FE8CC' : 'background:#fff;border:2px solid #C6D6EC'),\n          toggle: () => { const c = { ...this.state.checks }; c[k] = !c[k]; this.saveChecks(c); }\n        };\n      });\n      plazos = sel.plazos.filter(z => z.etapa === S.etapa).map(z => {\n        const val = S.calc[z.id] || '';\n        const type = z.u === 'ya' ? false : (z.u === 'd' ? 'date' : 'time');\n        const desdeCorto = z.desde.replace(/\\s*\\(.*\\)/, '');\n        return {\n          key: z.id, hito: z.hito, big: this.fmtPlazo(z), desde: z.desde, nota: z.nota || false, corregido: z.corregido || false,\n          chipStyle: 'flex:none;font-size:15px;font-weight:900;padding:9px 14px;border-radius:12px;white-space:nowrap;' + (z.critico ? 'background:#D02E63;color:#fff' : 'background:#0C2B5E;color:#fff'),\n          calcType: type, calcLabel: type === 'time' ? '¿Cuándo fue ' + desdeCorto + '?' : '¿Qué día fue ' + desdeCorto + '?',\n          calcOut: this.calcOut(z, val),\n          onCalc: ev => this.setState({ calc: { ...this.state.calc, [z.id]: ev.target.value } })\n        };\n      });\n      ntma = (sel.ntma || []).map((t, i) => ({ key: i, txt: t }));\n      if (S.etapa === 'seguimiento' && sel.postNota) postNota = sel.postNota;\n      if (S.etapa === 'seguimiento' && plazos.length === 0 && !postNota) postNota = 'Sin garantía de oportunidad después del alta para este problema.';\n    }\n    const idx = ETAPAS.findIndex(e => e.id === S.etapa);\n    const next = idx >= 0 && idx < ETAPAS.length - 1 ? ETAPAS[idx + 1] : null;\n    const M = D ? D.META : null;\n    return {\n      viewProblema: S.view === 'problema', viewEtapa: S.view === 'etapa', viewAcciones: S.view === 'acciones',\n      stepNum: S.view === 'problema' ? '1' : S.view === 'etapa' ? '2' : '3',\n      stepTitle: S.view === 'problema' ? 'Problema de salud' : S.view === 'etapa' ? 'Momento del paciente' : 'Sus acciones',\n      q: S.q, onQ: ev => this.setState({ q: ev.target.value }),\n      problemas, sinResultados: D && problemas.length === 0,\n      anexos: M ? M.contacto.anexos : '', horario: M ? M.contacto.horario : '',\n      selNombre: sel ? sel.nombre : '', selCie: sel ? sel.cie.join(' · ') : '', selCorto: sel ? sel.corto : '',\n      volverProblema: () => this.setState({ view: 'problema', etapa: null }),\n      volverEtapa: () => this.setState({ view: 'etapa' }),\n      setUrg: () => this.setState({ ctx: 'urgencia' }), setPiso: () => this.setState({ ctx: 'piso' }),\n      ctxUrgStyle: ctxBtn(S.ctx === 'urgencia'), ctxPisoStyle: ctxBtn(S.ctx === 'piso'),\n      ctxNombre: S.ctx === 'urgencia' ? 'Urgencia' : 'Piso',\n      etapas, etapaNombre: idx >= 0 ? ETAPAS[idx].nombre : '',\n      accs, doneCount: String(accs.filter(a => a.done).length), totalCount: String(accs.length),\n      plazos, hayPlazos: plazos.length > 0, postNota,\n      casos: (D ? D.CASOS : []).map((c, i) => ({ key: i, si: c.si, entonces: c.entonces })),\n      showCasos: S.showCasos, toggleCasos: () => this.setState({ showCasos: !S.showCasos }), casosCaret: S.showCasos ? '−' : '+',\n      ntma, showNtma: S.showNtma, toggleNtma: () => this.setState({ showNtma: !S.showNtma }), ntmaCaret: S.showNtma ? '−' : '+',\n      fuente: sel ? sel.fuente : '',\n      haySiguiente: !!next, siguienteLabel: next ? next.nombre : '',\n      siguiente: () => next && this.setState({ etapa: next.id, showCasos: next.id === 'confirmacion' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
